<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="limeBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4f63b" />
      <stop offset="100%" stop-color="#a3e635" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="280" y1="0" x2="280" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="520" y1="0" x2="520" y2="400" />
    <line x1="0" y1="80" x2="600" y2="80" />
    <line x1="0" y1="160" x2="600" y2="160" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="320" x2="600" y2="320" />
  </g>

  <!-- Top Matrix Header -->
  <g transform="translate(30, 30)">
    <rect width="18" height="18" rx="4" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" />
    <text x="28" y="14" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">MATRIZ DE TRAZABILIDAD HÍBRIDA</text>
    <rect x="420" y="0" width="120" height="20" rx="10" fill="url(#limeBadge)" />
    <text x="480" y="14" text-anchor="middle" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10" font-weight="800">100% VERIFICADO</text>
  </g>

  <!-- Flow Lines (Bezier Curves with glow) -->
  <path d="M 150 120 C 210 120, 210 150, 270 150" stroke="url(#cyanLine)" stroke-width="2" fill="none" />
  <path d="M 150 220 C 210 220, 210 180, 270 180" stroke="url(#cyanLine)" stroke-width="2" stroke-dasharray="4 4" fill="none" />
  <path d="M 390 150 C 440 150, 440 130, 480 130" stroke="#a855f7" stroke-width="2" fill="none" />
  <path d="M 390 150 C 440 150, 440 220, 480 220" stroke="#a855f7" stroke-width="2" fill="none" />
  <path d="M 390 180 C 440 180, 440 260, 480 260" stroke="#a855f7" stroke-width="2" fill="none" />

  <!-- Layer 1: Requisito de Usuario (RU) -->
  <g transform="translate(30, 85)">
    <rect width="120" height="70" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="12" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="800">RU-01 [IEEE 830]</text>
    <text x="12" y="42" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Autenticación Segura</text>
    <text x="12" y="56" fill="#64748b" font-family="system-ui, sans-serif" font-size="8">Estabilidad: Alta</text>
  </g>

  <g transform="translate(30, 185)">
    <rect width="120" height="70" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
    <text x="12" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="800">RU-02 [IEEE 830]</text>
    <text x="12" y="42" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Validación de Correo</text>
    <text x="12" y="56" fill="#64748b" font-family="system-ui, sans-serif" font-size="8">Estabilidad: Media</text>
  </g>

  <!-- Layer 2: Historia de Usuario (HU) -->
  <g transform="translate(270, 120)">
    <rect width="120" height="85" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
    <text x="12" y="22" fill="#c084fc" font-family="system-ui, sans-serif" font-size="10" font-weight="800">HU-01 [Gherkin]</text>
    <text x="12" y="38" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Como analista...</text>
    <text x="12" y="54" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8">Quiero verificar email</text>
    <rect x="12" y="62" width="70" height="14" rx="4" fill="#a855f7" fill-opacity="0.2" />
    <text x="16" y="72" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700">Dado-Cuando-Ent.</text>
  </g>

  <!-- Layer 3: Tareas Técnicas (TSK) -->
  <g transform="translate(480, 95)">
    <rect width="90" height="50" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="10" y="20" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" font-weight="800">TSK-01</text>
    <text x="10" y="36" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="8" font-weight="600">JWT Token Auth</text>
  </g>

  <g transform="translate(480, 160)">
    <rect width="90" height="50" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="10" y="20" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" font-weight="800">TSK-02</text>
    <text x="10" y="36" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="8" font-weight="600">Servicio SMTP</text>
  </g>

  <g transform="translate(480, 225)">
    <rect width="90" height="50" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="10" y="20" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" font-weight="800">TSK-03</text>
    <text x="10" y="36" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="8" font-weight="600">Captcha Anti-Bot</text>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(30, 310)">
    <rect width="540" height="55" rx="10" fill="#111827" stroke="#1f2937" />
    <text x="20" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="700">INTEGRIDAD BIDIRECCIONAL EN CASCADA</text>
    <text x="20" y="42" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Documento Fuente ⟷ Requisitos ⟷ Historias ⟷ Backlog Técnico</text>
    <circle cx="500" cy="27" r="5" fill="#10b981" />
    <text x="512" y="31" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="800">SINCRONIZADO</text>
  </g>
</svg>

