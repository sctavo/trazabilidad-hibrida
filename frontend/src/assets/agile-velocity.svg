<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4f63b" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d4f63b" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#d4f63b" stop-opacity="0.35" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="400" rx="16" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
  </g>

  <!-- Metric Area (Similar to Shopify KPI graph) -->
  <g transform="translate(35, 35)">
    <text x="0" y="16" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">VELOCIDAD Y COBERTURA DE SPRINTS</text>
    <text x="0" y="55" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="34" font-weight="900">100%</text>
    <text x="125" y="52" fill="#d4f63b" font-family="system-ui, sans-serif" font-size="14" font-weight="700">▲ Trazable sin desvíos</text>
  </g>

  <!-- Smooth Sparkline / Trend Area with Lime Glow -->
  <path d="M 35 190 Q 150 180, 240 140 T 420 110 T 565 75 L 565 240 L 35 240 Z" fill="url(#sparkGrad)" />
  <path d="M 35 190 Q 150 180, 240 140 T 420 110 T 565 75" stroke="#d4f63b" stroke-width="3" stroke-linecap="round" fill="none" />
  <circle cx="565" cy="75" r="5" fill="#d4f63b" />
  <circle cx="565" cy="75" r="10" stroke="#d4f63b" stroke-width="1.5" opacity="0.5" />

  <!-- Multi-Model AI Failover Badge row -->
  <g transform="translate(35, 270)">
    <rect width="530" height="95" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="18" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="800">CATÁLOGO DE MODELOS CON MITIGACIÓN ACTIVA</text>
    
    <!-- Gemini -->
    <g transform="translate(18, 38)">
      <rect width="115" height="42" rx="8" fill="#1e293b" stroke="#3b82f6" />
      <text x="10" y="18" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="10" font-weight="800">✨ Gemini 2.5</text>
      <text x="10" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8">Recomendado</text>
    </g>

    <!-- Gemma 3 -->
    <g transform="translate(145, 38)">
      <rect width="115" height="42" rx="8" fill="#1e293b" stroke="#475569" />
      <text x="10" y="18" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="700">🔬 Gemma 3</text>
      <text x="10" y="32" fill="#64748b" font-family="system-ui, sans-serif" font-size="8">Open Weights</text>
    </g>

    <!-- Mistral -->
    <g transform="translate(272, 38)">
      <rect width="115" height="42" rx="8" fill="#1e293b" stroke="#475569" />
      <text x="10" y="18" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="700">🌪️ Mistral Nemo</text>
      <text x="10" y="32" fill="#64748b" font-family="system-ui, sans-serif" font-size="8">Estructurado</text>
    </g>

    <!-- Nova -->
    <g transform="translate(399, 38)">
      <rect width="115" height="42" rx="8" fill="#1e293b" stroke="#475569" />
      <text x="10" y="18" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="700">⚡ Amazon Nova</text>
      <text x="10" y="32" fill="#64748b" font-family="system-ui, sans-serif" font-size="8">Micro v1</text>
    </g>
  </g>
</svg>

